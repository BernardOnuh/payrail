<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ff0cc"/>
      <stop offset="1" stop-color="#2bb98a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2b23"/>
      <stop offset="1" stop-color="#111613"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1500" height="500" fill="url(#edge)"/>
  <rect x="0" y="0" width="1500" height="4" fill="#2bb98a" opacity="0.9"/>

  <!-- dot grid -->
  <g fill="#2bb98a">
    <circle cx="90" cy="80" r="4" opacity="0.25"/>
    <circle cx="1410" cy="90" r="4" opacity="0.25"/>
    <circle cx="120" cy="420" r="4" opacity="0.25"/>
    <circle cx="1380" cy="410" r="4" opacity="0.25"/>
    <circle cx="720" cy="60" r="3" opacity="0.18"/>
    <circle cx="300" cy="60" r="3" opacity="0.18"/>
    <circle cx="1120" cy="440" r="3" opacity="0.18"/>
  </g>

  <!-- wordmark -->
  <text x="120" y="250" text-anchor="start" font-family="Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="150" letter-spacing="4" fill="#e7ece8">Pay</text>
  <text x="367" y="250" text-anchor="start" font-family="Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="150" letter-spacing="4" fill="#6fe6bb">rail</text>
  <line x1="126" y1="296" x2="420" y2="296" stroke="#6fe6bb" stroke-width="6" opacity="0.8"/>
  <text x="120" y="356" text-anchor="start" font-family="Menlo, monospace" font-size="38" letter-spacing="6" fill="#9fb3a8">STABLECOIN PAYOUTS FOR AI AGENTS</text>
  <text x="120" y="416" text-anchor="start" font-family="Menlo, monospace" font-size="26" letter-spacing="3" fill="#6fe6bb" opacity="0.85">NON-CUSTODIAL · HUMAN-SIGNED · MULTI-CHAIN</text>

  <!-- mark: one coin, many recipients -->
  <circle cx="1130" cy="250" r="120" fill="url(#mint)"/>
  <circle cx="1130" cy="250" r="120" fill="none" stroke="#0e1410" stroke-width="12"/>
  <circle cx="1130" cy="250" r="80" fill="none" stroke="#0e1410" stroke-width="9" opacity="0.85"/>

  <g stroke="url(#mint)" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.95">
    <path d="M1250 218 L1410 168"/>
    <path d="M1250 250 L1428 250"/>
    <path d="M1250 282 L1410 332"/>
  </g>
  <g fill="#8ff0cc">
    <circle cx="1416" cy="162" r="22"/>
    <circle cx="1434" cy="250" r="22"/>
    <circle cx="1416" cy="338" r="22"/>
  </g>
</svg>