<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ff0cc"/>
      <stop offset="1" stop-color="#2bb98a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#1f4a39"/>
      <stop offset="1" stop-color="#111613"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect x="8" y="8" width="1008" height="1008" rx="216" fill="url(#glow)" stroke="#20281f" stroke-width="4"/>
  <g stroke="#161c18" stroke-width="3" opacity="0.6">
    <!-- dot grid -->
    <circle cx="150" cy="200" r="5" fill="#2bb98a" opacity="0.25"/>
    <circle cx="874" cy="170" r="5" fill="#2bb98a" opacity="0.25"/>
    <circle cx="170" cy="824" r="5" fill="#2bb98a" opacity="0.25"/>
    <circle cx="854" cy="854" r="5" fill="#2bb98a" opacity="0.25"/>
    <circle cx="300" cy="120" r="4" fill="#2bb98a" opacity="0.18"/>
    <circle cx="724" cy="96" r="4" fill="#2bb98a" opacity="0.18"/>
    <circle cx="96" cy="700" r="4" fill="#2bb98a" opacity="0.18"/>
    <circle cx="928" cy="620" r="4" fill="#2bb98a" opacity="0.18"/>
  </g>

  <!-- source coin -->
  <circle cx="300" cy="430" r="150" fill="url(#mint)"/>
  <circle cx="300" cy="430" r="150" fill="none" stroke="#0e1410" stroke-width="16"/>
  <circle cx="300" cy="430" r="104" fill="none" stroke="#0e1410" stroke-width="12" opacity="0.85"/>
  <circle cx="300" cy="430" r="58" fill="#0e1410" opacity="0.12"/>

  <!-- fanned rails: one coin, many recipients -->
  <g stroke="url(#mint)" stroke-width="26" stroke-linecap="round" fill="none" opacity="0.95">
    <path d="M452 392 L780 300"/>
    <path d="M452 430 L832 430"/>
    <path d="M452 468 L780 560"/>
  </g>

  <!-- recipients -->
  <g fill="#8ff0cc">
    <circle cx="800" cy="292" r="42"/>
    <circle cx="850" cy="430" r="42"/>
    <circle cx="800" cy="568" r="42"/>
  </g>
  <g fill="#0e1410">
    <circle cx="800" cy="292" r="16"/>
    <circle cx="850" cy="430" r="16"/>
    <circle cx="800" cy="568" r="16"/>
  </g>

  <!-- wordmark -->
  <text x="338" y="790" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="150" letter-spacing="6" fill="#e7ece8">Pay</text>
  <text x="642" y="790" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="150" letter-spacing="6" fill="#6fe6bb">rail</text>
  <text x="512" y="852" text-anchor="middle" font-family="Menlo, monospace" font-weight="400" font-size="40" letter-spacing="18" fill="#6fe6bb">AGENT PAYOUTS</text>
</svg>